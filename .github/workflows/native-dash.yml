name: Native DASH and ASS integration
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      public_samples:
        description: Run Media3 public network samples
        type: boolean
        default: false
jobs:
  playback:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            platform: darwin-aarch64
          - os: macos-15-intel
            arch: x86_64
            platform: darwin-x86-64
          - os: windows-2022
            arch: x86_64
            msvc: x64
            platform: win32-x86-64
          - os: windows-11-arm
            arch: arm64
            msvc: arm64
            platform: win32-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Select the SDK-compatible Apple tools
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer' >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.platform == 'win32-arm64' && 'microsoft' || 'temurin' }}
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc }}
      - name: Build complete runtime
        run: python tools/build_media_runtime.py --arch ${{ matrix.arch }} --output mediaplayer/build/generated/mediaResources/composemediaplayer/runtime
      - name: Decode real video and audio and render ASS
        shell: bash
        run: ./gradlew :mediaplayer:jvmTest --tests '*NativeDashIntegrationTest' --tests '*NativeLifecycleIntegrationTest' --tests '*MediaHttpTest' --tests '*NativeRuntimeBundleTest' --tests '*WidevineNativeIntegrationTest' --tests '*MacMetadataStartup*Test' --no-configuration-cache
        env:
          COMPOSE_MEDIA_PLAYER_RUN_DASH_TEST: '1'
          COMPOSE_MEDIA_PLAYER_RUN_NATIVE_STARTUP_TEST: '1'
      - name: Media3 public DASH and ASS samples
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.public_samples }}
        shell: bash
        run: ./gradlew :mediaplayer:jvmTest --tests '*Media3PublicNativeIntegrationTest' --no-configuration-cache
        env:
          COMPOSE_MEDIA_PLAYER_RUN_PUBLIC_TEST: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-playback-${{ matrix.platform }}
          path: |
            mediaplayer/build/reports/tests/
            mediaplayer/build/generated/mediaResources/
